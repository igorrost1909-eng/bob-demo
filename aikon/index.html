<!doctype html>
<html lang="ru">
<head>

  <style>
    body {
      margin: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 460px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);

    h1 { font-size: 22px; color: #fff; margin-bottom: 12px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    a:hover { background: #1d4ed8; }

    <h1>Демо-стенд обновляется</h1>
